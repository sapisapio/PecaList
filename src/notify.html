<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PecaList 通知</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: auto; background: var(--bg); overflow: hidden; }
  body { display: block; padding: 8px; }
  .cards { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 10px 12px; cursor: pointer; position: relative;
  }
  .card:hover { border-color: var(--accent); }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .live { width: 8px; height: 8px; border-radius: 50%; background: var(--favc); flex: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--favc) 22%, transparent); }
  .card.plain .live { background: var(--new); box-shadow: 0 0 0 3px color-mix(in srgb, var(--new) 22%, transparent); }
  .card .ttl { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .ttl b { color: var(--favc); }
  .card.plain .ttl b { color: var(--text); }
  .card .x {
    border: 0; background: transparent; color: var(--text-3); font: inherit; font-size: 13px;
    width: 22px; height: 22px; border-radius: 5px; cursor: pointer; flex: none;
  }
  .card .x:hover { background: var(--row-hover); color: var(--text); }
  .card .desc {
    margin: 4px 0 8px 16px; font-size: 12px; color: var(--text-2); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .acts { display: flex; gap: 6px; margin-left: 16px; }
  .card .acts .pill { height: 24px; font-size: 12px; }
  .card .acts .meta { margin-left: auto; color: var(--text-3); font-size: 11px; align-self: center; }
  .card.rec .live { background: var(--error); box-shadow: 0 0 0 3px color-mix(in srgb, var(--error) 22%, transparent); }
  .card.rec.done .live { background: var(--new); box-shadow: 0 0 0 3px color-mix(in srgb, var(--new) 22%, transparent); }
  .card.rec .ttl b { color: var(--text); }
  .more { text-align: center; font-size: 11px; color: var(--text-3); padding: 2px 0 0; }
</style>
</head>
<body>
<div class="cards" id="cards"></div>
<div class="more" id="more" hidden></div>
<script type="module" src="notify.js"></script>
</body>
</html>
